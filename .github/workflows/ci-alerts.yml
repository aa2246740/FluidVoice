name: CI incident alerts
on:
  workflow_run:
    workflows: ["Build and Test", "Release unsigned preview"]
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `[CI incident] ${run.name} failed on default branch`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state:'open', labels:'area:ci'});
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            const body = `Automated failure alert. No user logs, recordings or transcripts are attached.\n\nRun: ${run.html_url}\nCommit: \`${run.head_sha}\`\n\nUse [incident runbooks](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.payload.repository.default_branch}/docs/readiness/RUNBOOKS.md). Preserve relevant artifacts, reproduce the failure, and record resolution evidence.`;
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number:existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body, labels:['type:bug','area:ci','priority:P1'], assignees:[context.repo.owner]});
            }
